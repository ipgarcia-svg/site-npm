name: preflight
on:
  pull_request:
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Débito da Fase 2 (F4) quitado no PR feat/fase2-estrutura;
      # exceções remanescentes ficam documentadas dentro do próprio
      # preflight.py (EXCECOES_F4), não como tolerância genérica.
      - run: python3 scripts/preflight.py
